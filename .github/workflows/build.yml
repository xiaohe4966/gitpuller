name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go vet ./...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p out
          BIN="gitpuller_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then BIN="${BIN}.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "out/$BIN" .
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: gitpuller-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
